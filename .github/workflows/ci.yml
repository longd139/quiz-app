name: CI

on:
  push:
    branches: [main, feat/*, fix/*]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit

      - name: Start local Supabase test stack
        run: npx supabase start

      - name: Setup local env & seed test database
        run: npm run setup:local

      - name: Run database & RLS integration tests
        run: npm run test:integration

      - name: Build production bundle
        run: npm run build
        env:
          VITE_APP_ENV: test
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key

      - name: Install Playwright Chromium & run E2E
        run: |
          npx playwright install chromium
          npm run test:e2e

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Stop local Supabase stack
        if: always()
        run: npx supabase stop
